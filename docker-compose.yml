services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: acip-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-acip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acip} -d ${POSTGRES_DB:-acip}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
